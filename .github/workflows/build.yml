name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # required to attach assets to GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MAME_VERSION: "0.288"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages + NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Prepare MAME source (download + patch + myosd overlay)
        run: bash scripts/prepare_mame_src.sh "$MAME_VERSION"

      - name: Build MAME core (.so)
        run: bash scripts/build_mame_core.sh

      - name: Build APK (debug)
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android-MAME4droid
          gradle-version: '8.9'
          arguments: assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAME4droid-apk
          path: android-MAME4droid/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Attach APK to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android-MAME4droid/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
